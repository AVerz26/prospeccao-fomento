# Radar de tecnologias emergentes: lista própria, mais granular que os temas do config.yaml.
# Procura sinais de estágio inicial: preprints, código aberto novo, startups recentes e editais de pesquisa (não de inovação madura).

pesos:
  cresc_pesquisa: 0.25    # crescimento de preprints (OpenAlex + arXiv), últimos 6 meses vs. 6 anteriores
  atividade_pesquisa: 0.10 # volume recente de preprints (precisa haver atividade, não só ruído)
  codigo: 0.20            # repositórios novos no GitHub (12m vs 12m anteriores) + modelos/datasets novos no Hugging Face
  startups: 0.15          # empresas do Y Combinator (últimas 3 turmas/anos) + menções em AgFunder News
  financiamento_inicial: 0.15  # chamadas Horizon abertas do tipo "Research and Innovation Actions"/EIC (proxy de TRL baixo)
  imaturidade: 0.10       # quanto MENOR o volume total de publicações, mais cedo o estágio
  mt_fit: 0.05            # aderência a Mato Grosso (1-5)

# busca: termos curtos para Hugging Face e Y Combinator (que buscam por nome/texto livre).
tecnologias:
  - id: geo_foundation
    nome: Modelos de fundação para observação da Terra
    mt_fit: 5
    kw: ["geospatial foundation model", "earth observation foundation model", "satellite embeddings", "remote sensing foundation model"]
    busca: ["geospatial", "earth observation"]
  - id: llm_agro
    nome: IA generativa e assistentes (LLM) para agronomia
    mt_fit: 4
    kw: ["agricultural large language model", "LLM agriculture", "generative AI agriculture", "agronomy chatbot"]
    busca: ["agriculture llm", "agronomy"]
  - id: robo_capina
    nome: Robôs autônomos e capina a laser
    mt_fit: 4
    kw: ["laser weeding", "autonomous weeding robot", "agricultural robot", "robotic weed control"]
    busca: ["weeding", "agricultural robot"]
  - id: pulverizacao_alvo
    nome: Pulverização localizada (see-and-spray) e drones de aplicação
    mt_fit: 5
    kw: ["see and spray", "targeted spraying", "precision spraying drone", "variable rate spraying"]
    busca: ["spraying", "crop spraying"]
  - id: uav_lidar
    nome: Drones com LiDAR e biomassa/carbono florestal
    mt_fit: 4
    kw: ["UAV LiDAR biomass", "forest carbon LiDAR", "drone LiDAR vegetation", "canopy height mapping"]
    busca: ["lidar", "forest carbon"]
  - id: edicao_genomica
    nome: Edição genômica (base/prime editing) em culturas
    mt_fit: 5
    kw: ["base editing plants", "prime editing crops", "CRISPR crop improvement", "genome editing soybean"]
    busca: ["crispr", "genome editing"]
  - id: fenotipagem_ia
    nome: Fenotipagem de alto rendimento com IA e hiperespectral
    mt_fit: 4
    kw: ["high-throughput plant phenotyping", "hyperspectral crop imaging", "deep learning phenotyping", "UAV phenotyping"]
    busca: ["phenotyping", "hyperspectral"]
  - id: rnai_peptideos
    nome: RNAi pulverizável e peptídeos para proteção de plantas
    mt_fit: 4
    kw: ["sprayable RNAi", "dsRNA biopesticide", "antimicrobial peptides crop protection", "RNA interference pest control"]
    busca: ["rnai", "biopesticide"]
  - id: syncom
    nome: Consórcios microbianos sintéticos e engenharia do microbioma
    mt_fit: 5
    kw: ["synthetic microbial community plants", "SynCom", "rhizosphere microbiome engineering", "microbial consortia crops"]
    busca: ["microbiome", "biologicals"]
  - id: fixacao_n_cereais
    nome: Fixação biológica de nitrogênio em cereais
    mt_fit: 5
    kw: ["nitrogen fixation cereals", "engineered nitrogen-fixing bacteria", "nitrogenase engineering", "biological nitrogen fixation maize"]
    busca: ["nitrogen fixation", "nitrogen fixing"]
  - id: rochagem
    nome: Intemperismo acelerado de rochas (rochagem) e remoção de carbono
    mt_fit: 5
    kw: ["enhanced rock weathering", "rock dust agriculture", "basalt soil amendment", "silicate rock carbon removal"]
    busca: ["rock weathering", "carbon removal"]
  - id: mrv_solo
    nome: MRV de carbono no solo com sensoriamento e IA
    mt_fit: 5
    kw: ["soil carbon MRV", "soil organic carbon remote sensing", "digital soil mapping carbon", "soil carbon measurement"]
