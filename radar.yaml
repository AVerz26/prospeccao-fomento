  - id: metano_aditivos
    nome: Redução de metano entérico (aditivos e vacinas)
    mt_fit: 5
    kw: ["3-NOP methane", "Asparagopsis methane", "methane vaccine ruminants", "enteric methane inhibitor"]
    busca: ["methane cattle", "enteric methane"]
  - id: saf_etanol
    nome: Combustível de aviação sustentável a partir de etanol (alcohol-to-jet)
    mt_fit: 5
    kw: ["alcohol-to-jet", "ethanol to jet fuel", "sustainable aviation fuel ethanol", "ethanol upgrading jet"]
    busca: ["alcohol to jet", "sustainable aviation fuel"]
  - id: biometano
    nome: Biometano de vinhaça e resíduos agroindustriais
    mt_fit: 5
    kw: ["biomethane from vinasse", "biogas upgrading agroindustrial", "biomethane agricultural residues", "anaerobic digestion vinasse"]
    busca: ["biomethane", "biogas"]
  - id: amonia_verde
    nome: Amônia verde e fertilizantes nitrogenados de baixa emissão
    mt_fit: 5
    kw: ["green ammonia fertilizer", "electrochemical nitrogen fertilizer", "plasma nitrogen fixation", "low-carbon nitrogen fertilizer"]
    busca: ["green ammonia", "fertilizer"]
  - id: fermentacao_precisao
    nome: Fermentação de precisão e biomanufatura de insumos
    mt_fit: 4
    kw: ["precision fermentation", "biomanufacturing agricultural inputs", "cell-free protein production", "microbial protein production"]
    busca: ["precision fermentation", "biomanufacturing"]
  - id: sensores_solo_iot
