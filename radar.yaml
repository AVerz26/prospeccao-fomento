    busca: ["traceability", "supply chain"]
  - id: genomica_pecuaria
    nome: Seleção genômica e melhoramento de gado tropical
    mt_fit: 5
    kw: ["genomic selection cattle", "livestock genomic prediction", "tropical cattle genomics", "Nelore genomic"]
    busca: ["genomic selection", "livestock genomics"]
  - id: agrivoltaica
    nome: Agrivoltaica (solar e cultivo na mesma área)
    mt_fit: 3
    kw: ["agrivoltaics", "agrophotovoltaic", "solar crop co-location", "dual-use solar farmland"]
    busca: ["agrivoltaic", "agrivoltaics"]
