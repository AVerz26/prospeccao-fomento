# Configuração da prospecção de tendências para editais de fomento (Mato Grosso)
# Edite livremente: temas, palavras-chave, fontes e pesos.

# Pesos do score final (somam 1.0). Métricas ausentes (fonte fora do ar) são redistribuídas.
pesos:
  sci_volume: 0.08     # volume de publicações científicas no último ano completo
  sci_growth: 0.17     # crescimento da participação do tema na ciência (vs. todo o corpus)
  conf_volume: 0.07    # volume em anais de congressos
  conf_growth: 0.08    # crescimento em anais de congressos
  funding: 0.20        # chamadas internacionais abertas (Horizon Europe + Grants.gov)
  media: 0.10          # intensidade/tendência na mídia global (GDELT)
  web: 0.08            # menções nas páginas de congressos/fomento/notícias monitoradas
  trends: 0.04         # tendência de buscas no Google Trends (12 meses)
  mt_fit: 0.18         # aderência à realidade de Mato Grosso (campo mt_fit de cada tema)

gdelt:
  timespan: 6months
  headlines_por_tema: 5

# Fontes para scraping/RSS. type: html | rss. categoria: congresso | fomento_br | noticia | ciencia
# O scraper respeita robots.txt para páginas HTML e falha de forma silenciosa (registra aviso).
fontes_web:
  # FAPEMAT: o robots.txt do site bloqueia coleta automatizada; acompanhe manualmente ou peça um feed/API ao órgão.
  - {nome: CNPq - Chamadas,          categoria: fomento_br, type: html, url: "https://www.gov.br/cnpq/pt-br/chamadas"}
  - {nome: FINEP - Chamadas,         categoria: fomento_br, type: html, url: "http://www.finep.gov.br/chamadas-publicas"}
  - {nome: FAPESP - Oportunidades,   categoria: fomento_br, type: html, url: "https://fapesp.br/oportunidades"}
  - {nome: Embrapii,                 categoria: fomento_br, type: html, url: "https://embrapii.org.br/"}
  - {nome: Fundo Amazônia,           categoria: fomento_br, type: html, url: "https://www.fundoamazonia.gov.br/pt/home/"}
  - {nome: World Food Forum (FAO),   categoria: congresso,  type: html, url: "https://www.world-food-forum.org/"}
  - {nome: FAO Newsroom,             categoria: congresso,  type: html, url: "https://www.fao.org/newsroom/en"}
  - {nome: CAPES - Editais,          categoria: fomento_br, type: html, url: "https://www.gov.br/capes/pt-br/assuntos/editais-e-resultados-capes"}
  - {nome: BNDES - Chamadas públicas, categoria: fomento_br, type: html, url: "https://www.bndes.gov.br/wps/portal/site/home/transparencia/chamadas-publicas"}
  - {nome: Embrapa Notícias,         categoria: noticia,    type: html, url: "https://www.embrapa.br/busca-de-noticias"}
  - {nome: Agrishow,                 categoria: congresso,  type: html, url: "https://www.agrishow.com.br/"}
  - {nome: CGIAR News,               categoria: noticia,    type: html, url: "https://www.cgiar.org/news-events/"}
  - {nome: Nature Food,              categoria: ciencia,    type: rss,  url: "https://www.nature.com/natfood.rss"}
  - {nome: Nature Sustainability,    categoria: ciencia,    type: rss,  url: "https://www.nature.com/natsustain.rss"}
  - {nome: Nature Climate Change,    categoria: ciencia,    type: rss,  url: "https://www.nature.com/nclimate.rss"}
  - {nome: ScienceDaily Agricultura, categoria: ciencia,    type: rss,  url: "https://www.sciencedaily.com/rss/plants_animals/agriculture_and_food.xml"}
  - {nome: ScienceDaily Clima,       categoria: ciencia,    type: rss,  url: "https://www.sciencedaily.com/rss/earth_climate/climate.xml"}
  - {nome: Mongabay,                 categoria: noticia,    type: rss,  url: "https://news.mongabay.com/feed/"}
  - {nome: Agência Fapesp,           categoria: noticia,    type: rss,  url: "https://agencia.fapesp.br/rss/"}

# Temas. mt_fit: 1 (pouco aderente) a 5 (muito aderente a MT).
temas:
  - id: agro_digital_ia
    nome: Agricultura digital, IA e agricultura de precisão
    mt_fit: 5
    keywords_en: ["precision agriculture", "digital agriculture", "smart farming", "agricultural artificial intelligence", "agtech"]
    keywords_pt: ["agricultura de precisão", "agricultura digital", "inteligência artificial no agro", "agtech"]
    extra_en: ["crop yield prediction", "machine learning agriculture", "digital twin farm", "variable rate application", "farm management software", "IoT agriculture sensors", "decision support system agriculture"]
    extra_pt: ["previsão de safra", "aprendizado de máquina agricultura", "gêmeo digital", "taxa variável", "sensores IoT no campo", "internet das coisas agro"]
    termos_amplos: ["agtech", "machine learning", "big data", "IoT", "inteligência artificial", "digital farming", "farmtech", "conectividade rural"]   # só para casar com páginas web (mais permissivo)
    edital_mt: "Chamada de P&D&I em IA aplicada ao agro (modelos preditivos de safra, visão computacional, gêmeos digitais de fazenda) com contrapartida de cooperativas e startups."

