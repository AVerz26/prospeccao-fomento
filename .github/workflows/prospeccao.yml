name: Prospecção de tendências

on:
  schedule:
    - cron: "0 10 * * 1"      # toda segunda, 10:00 UTC (06:00 em Cuiabá)
  workflow_dispatch:           # botão "Run workflow" na aba Actions
    inputs:
      temas:
        description: "Limitar a ids de tema (separados por vírgula). Vazio = todos"
        required: false
        default: ""

permissions:
  contents: write              # para commitar os resultados em resultados/

concurrency:
  group: prospeccao
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Mantém o cache HTTP e o cache do Google Trends entre execuções:
      # o Trends limita requisições (429), então cada semana completa o que faltou.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: cache-${{ github.run_id }}
          restore-keys: cache-

      - name: Restaurar histórico de scores
        run: |
          mkdir -p output
          [ -f resultados/historico_scores.csv ] && cp resultados/historico_scores.csv output/ || true

      - name: Rodar prospecção
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          PYTHONIOENCODING: utf-8
          TEMAS: ${{ github.event.inputs.temas }}
        # GDELT fica de fora: IPs compartilhados de runners costumam levar 429. O Google News assume.
        run: python run.py --skip midia --temas "$TEMAS"

      - name: Organizar resultados
        run: |
          DIA=$(ls -1 output | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort | tail -1)
          mkdir -p "resultados/$DIA"
          cp "output/$DIA/relatorio.html" "output/$DIA/prospeccao.xlsx" "resultados/$DIA/"
          cp "output/$DIA/relatorio.pdf" "resultados/$DIA/"
          cp "output/$DIA/relatorio.pdf" resultados/relatorio-atual.pdf
          cp output/historico_scores.csv resultados/
          echo "DIA=$DIA" >> "$GITHUB_ENV"

      - name: Atualizar README com o último relatório
        run: python atualizar_readme.py "$DIA"

      - uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ env.DIA }}
          path: output/${{ env.DIA }}/relatorio.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Commitar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados README.md
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "Prospecção de ${DIA}"
          # o remoto pode ter avançado durante a execução: integra e tenta de novo
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
